name: Archivio sagre

# L'API pubblica solo le sagre future: quando una finisce, sparisce. Questo job
# la cattura prima che succeda e la mette in archivio, così la sua pagina resta
# viva e indicizzata. Va eseguito almeno una volta al giorno, o le sagre che
# finiscono nel frattempo le perdiamo per sempre.
on:
  schedule:
    - cron: "0 3 * * *" # ogni notte alle 03:00 UTC
  workflow_dispatch: # e a mano, dalla tab Actions

# Serve per poter committare l'archivio aggiornato.
permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica l'archivio aggiornato dal sito
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://sagramanije.it/api/archivio \
            -o /tmp/archivio.json

      - name: Aggiorna il file solo se le sagre sono cambiate
        id: confronto
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys

          nuovo = json.load(open("/tmp/archivio.json"))
          if not isinstance(nuovo.get("sagre"), list) or not nuovo["sagre"]:
              sys.exit("archivio vuoto o malformato: non tocco niente")

          vecchio = json.load(open("data/archivio-sagre.json"))

          # Confronto per id, ignorando l'ordine e soprattutto il campo
          # "aggiornato": quello cambia a ogni esecuzione e da solo farebbe
          # scattare un commit ogni notte anche senza sagre nuove o modificate.
          def per_id(d, nome):
              indicizzate = {s["id"]: s for s in d["sagre"]}
              if len(indicizzate) != len(d["sagre"]):
                  sys.exit(f"{nome} contiene id duplicati: non tocco niente")
              return indicizzate

          vecchie = per_id(vecchio, "archivio attuale")
          nuove = per_id(nuovo, "archivio scaricato")

          # L'archivio può solo crescere: controllare gli id, e non soltanto
          # la lunghezza, evita di accettare una sostituzione accidentale.
          mancanti = set(vecchie) - set(nuove)
          if mancanti:
              sys.exit(f"archivio in calo: mancano {len(mancanti)} id già salvati")

          inserite = set(nuove) - set(vecchie)
          aggiornate = {
              id_sagra for id_sagra in set(vecchie) & set(nuove)
              if vecchie[id_sagra] != nuove[id_sagra]
          }

          if not inserite and not aggiornate:
              print("cambiato=no")
              print(f"nota=nessuna sagra nuova o aggiornata ({len(nuove)} in archivio)")
          else:
              json.dump(nuovo, open("data/archivio-sagre.json", "w"))
              print("cambiato=si")
              print(
                  f"nota={len(inserite)} nuove, {len(aggiornate)} aggiornate "
                  f"({len(nuove)} in archivio)"
              )
          PY

      - name: Riepilogo
        run: echo "${{ steps.confronto.outputs.nota }}"

      - name: Committa l'archivio
        if: steps.confronto.outputs.cambiato == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archivio-sagre.json
          git commit -m "[data] aggiornato archivio sagre"
          git push
